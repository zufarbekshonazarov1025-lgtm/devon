name: APK yig'ish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Yig'ish
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Xatoni ko'rsatish
        if: failure()
        run: |
          { grep -E "error:|warning: \[|\.java:[0-9]+: |AAPT|ERROR" build.log | head -5; awk '/What went wrong/{f=1} f' build.log | grep -v '^$' | head -4; } | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          { echo '```'; tail -80 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Nomlash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Devon.apk
      - uses: actions/upload-artifact@v4
        with: { name: Devon-apk, path: Devon.apk }
      - name: Yuklab olish sahifasiga chiqarish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Devon APK
          body: "Devon ilovasining oxirgi yig'ilgan nusxasi (№${{ github.run_number }}). Telefonda Devon.apk faylini yuklab oling va o'rnating."
          files: Devon.apk
          make_latest: true
