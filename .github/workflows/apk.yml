name: APK yig'ish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Yig'ish
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Nomlash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Devon.apk
      - uses: actions/upload-artifact@v4
        with: { name: Devon-apk, path: Devon.apk }
      - name: Yuklab olish sahifasiga chiqarish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Devon APK
          body: "Devon ilovasining oxirgi yig'ilgan nusxasi (№${{ github.run_number }}). Telefonda Devon.apk faylini yuklab oling va o'rnating."
          files: Devon.apk
          make_latest: true
